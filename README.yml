module_name: Terraform ALB Module
module_description: The Terraform Wrapper for ALB simplifies the configuration of Load Balancer Services in the AWS cloud. This wrapper functions as a predefined template, facilitating the creation and management of Load Balancers by handling all the technical details.
module_badges:
  - url: "https://github.com/gocloudLa/terraform-aws-wrapper-alb/releases/latest"
    image: "https://img.shields.io/github/v/release/gocloudLa/terraform-aws-wrapper-alb.svg?style=for-the-badge"
    alt: "Latest Release"
  - url: ""
    image: "https://img.shields.io/github/last-commit/gocloudLa/terraform-aws-wrapper-alb.svg?style=for-the-badge"
    alt: "Last Commit"
  - url: "https://registry.terraform.io/modules/gocloudLa/wrapper-alb/aws"
    image: "https://img.shields.io/badge/Terraform-Registry-7B42BC?style=for-the-badge&logo=terraform&logoColor=white"
    alt: "Terraform Registry"
quick_start: |
  ```hcl
  alb_parameters = {
      "ExExternal00" = {
        subnets  = data.aws_subnets.public.ids
        internal = false
        # vpc_name    = "" # Default: ${local.common_name} (dmc-prd)
  
        # Required to create access logs
        # enable_alb_logs        = true # Default: false
        # alb_logs_force_destroy = true # Default: false
        # alb_logs_lifecycle = [] # Default: [{
        #   id      = "move-to-onezone-ia"
        #   enabled = true
        #   transition = [{
        #     days          = 30
        #     storage_class = "ONEZONE_IA"
        #   }]
        # }]
  
        listeners = {
          80 = {
            port     = 80
            protocol = "HTTP"
            redirect = {
              port        = "443"
              protocol    = "HTTPS"
              status_code = "HTTP_301"
            }
          }
          443 = {
            port            = 443
            protocol        = "HTTPS"
            certificate_arn = data.aws_acm_certificate.this.arn
            action_type     = "fixed-response"
            fixed_response = {
              content_type = "text/plain"
              message_body = "Fixed message"
              status_code  = "200"
            }
          }
        }
        
        ingress_with_cidr_blocks = [
          {
            rule        = "http-80-tcp"
            cidr_blocks = "0.0.0.0/0"
            description = "Enable all access"
          },
          {
            rule        = "https-443-tcp"
            cidr_blocks = "0.0.0.0/0"
            description = "Enable all access"
          }
        ]
        dns_records = {
          "" = {
            zone_name    = "${local.zone_public}"
            private_zone = false
          }
          # Para Generar un registro en la RAIZ de la Zona DNS
          # Utilizar como key _null_ 
          # "_null_" = {
          #   zone_name    = local.zone_public
          #   private_zone = false
          # } # Esto genera por Ej. https://example.com
        }
      }
    }
    alb_defaults = var.alb_defaults
  ```
features:
  - icon: 🛡️
    title: Web Application Firewall
    short_description: Configures WAF rules and automatically attaches WebACL to ALB listeners
    long_description: |
      Perform the creation and configuration of WAF rules (WebAcl) as requested in the configuration, the new WebAcl generated is attached by default to the listeners used by the Amazon ALB service.
    examples:
      - title: Configuration Code
        code: |
          ```hcl
          alb_parameters = {
            "external-00" = {
              ...
              waf_logging_enable    = true
              waf_logging_filter    = {} # Log All events (default only COUNT & BLOCK)
              # waf_logging_retention =  # Default 7 days
              waf_rules = [
                {
                  name     = "AWSManagedRulesCommonRuleSet-rule-1"
                  priority = "10"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesCommonRuleSet-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesCommonRuleSet" //WCU 700
                    vendor_name = "AWS"
                    rule_action_overrides = [
                      {
                        name = "SizeRestrictions_Cookie_HEADER"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "SizeRestrictions_BODY"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "EC2MetaDataSSRF_BODY"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "EC2MetaDataSSRF_COOKIE"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "EC2MetaDataSSRF_URIPATH"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "EC2MetaDataSSRF_QUERYARGUMENTS"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "CrossSiteScripting_BODY"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "NoUserAgent_HEADER"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "SizeRestrictions_QUERYSTRING"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "GenericLFI_BODY"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "GenericRFI_BODY"
                        action_to_use = { count = {} }
                      }
                    ]
                  }
                },
                {
                  name     = "AWSManagedRulesKnownBadInputsRuleSet-rule-2"
                  priority = "20"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesKnownBadInputsRuleSet-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesKnownBadInputsRuleSet" //WCU 200
                    vendor_name = "AWS"
                    rule_action_overrides = [
                      {
                        name = "PROPFIND_METHOD"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "Log4JRCE"
                        action_to_use = { count = {} }
                      }
                    ]
                  }
                },
                {
                  name     = "AWSManagedRulesSQLiRuleSet-rule-3"
                  priority = "30"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesSQLiRuleSet-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesSQLiRuleSet" //WCU 200
                    vendor_name = "AWS"
                    rule_action_overrides = [
                      {
                        name = "SQLi_BODY"
                        action_to_use = { count = {} }
                      }
                    ]
                  }
                },
                {
                  name     = "AWSManagedRulesLinuxRuleSet-rule-4"
                  priority = "40"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesLinuxRuleSet-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesLinuxRuleSet" //WCU 700
                    vendor_name = "AWS"
          
                  }
                },
                {
                  name     = "AWSManagedRulesAmazonIpReputationList-rule-5"
                  priority = "50"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesAmazonIpReputationList-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesAmazonIpReputationList" //WCU 25
                    vendor_name = "AWS"
                  }
                },
                {
                  name     = "AWSManagedRulesAnonymousIpList-rule-6"
                  priority = "60"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesAnonymousIpList-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesAnonymousIpList" //WCU 50
                    vendor_name = "AWS"
                    rule_action_overrides = [
                      {
                        name = "HostingProviderIPList"
                        action_to_use = { count = {} }
                      }
                    ]
                  }
                },
              ]
              ...
            }
          }
          ```
  - icon: 🌐
    title: DNS Record
    short_description: Registers a CNAME DNS record in a Route53 hosted zone
    long_description: |
      Register a CNAME DNS record in a Route53 hosted zone that is present within the account, which can be public or private depending on the desired visibility type of the record.
    examples:
      - title: Configuration Code
        code: |
          ```hcl
          dns_records = {
            "" = {
              # zone_name    = local.zone_private
              # private_zone = true
              zone_name    = local.zone_public
              private_zone = false
            }
          }
          ```
  - icon: 📜
    title: Access Log
    short_description: Create S3 bucket and configure LoadBalancer access log in S3
    long_description: |
      Create S3 bucket and configure LoadBalancer access log in S3
    examples:
      - title: Configuration Code
        code: |
          ```hcl
          enable_alb_logs        = true # Default: false
          alb_logs_force_destroy = true # Default: false
          alb_logs_lifecycle = [{
            id      = "move-to-onezone-ia"
            enabled = true
            transition = [{
              days          = 30
              storage_class = "ONEZONE_IA"
            }]
          }]
          ```
