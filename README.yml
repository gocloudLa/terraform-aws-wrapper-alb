                  priority = "20"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesKnownBadInputsRuleSet-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesKnownBadInputsRuleSet" //WCU 200
                    vendor_name = "AWS"
                    rule_action_overrides = [
                      {
                        name = "PROPFIND_METHOD"
