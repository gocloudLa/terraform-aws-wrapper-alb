module_name: Terraform ALB Module
module_description: The Terraform Wrapper for ALB simplifies the configuration of Load Balancer Services in the AWS cloud. This wrapper functions as a predefined template, facilitating the creation and management of Load Balancers by handling all the technical details.
module_badges:
  - url: "https://github.com/gocloudLa/terraform-aws-wrapper-alb/releases/latest"
    image: "https://img.shields.io/github/v/release/gocloudLa/terraform-aws-wrapper-alb.svg?style=for-the-badge"
    alt: "Latest Release"
  - url: ""
    image: "https://img.shields.io/github/last-commit/gocloudLa/terraform-aws-wrapper-alb.svg?style=for-the-badge"
    alt: "Last Commit"
  - url: "https://registry.terraform.io/modules/gocloudLa/wrapper-alb/aws"
    image: "https://img.shields.io/badge/Terraform-Registry-7B42BC?style=for-the-badge&logo=terraform&logoColor=white"
    alt: "Terraform Registry"
quick_start: |
  ```hcl
  alb_parameters = {
      "ExExternal00" = {
        subnets  = data.aws_subnets.public.ids
        internal = false
        # vpc_name    = "" # Default: ${local.common_name} (dmc-prd)
  
        # Required to configure logs
        # enable_access_logs       = true # Default: false
        # enable_connection_logs   = true # Default: false
        # enable_health_check_logs = true # Default: false
        # bucket_logs = "existing-logs-bucket-name" # Optional: if set, the module will NOT create a new bucket
        # alb_logs_force_destroy = true # Default: false
        # alb_logs_lifecycle = [] 
        # # Default: [{
        # #   id      = "move-to-onezone-ia"
        # #   enabled = true
        # #   transition = [{
        # #     days          = 30
        # #     storage_class = "ONEZONE_IA"
        # #   }]
        # # }]
  
        listeners = {
          80 = {
            port     = 80
            protocol = "HTTP"
            redirect = {
              port        = "443"
              protocol    = "HTTPS"
              status_code = "HTTP_301"
            }
          }
          443 = {
            port            = 443
            protocol        = "HTTPS"
            certificate_arn = data.aws_acm_certificate.this.arn
            action_type     = "fixed-response"
            fixed_response = {
              content_type = "text/plain"
              message_body = "Fixed message"
              status_code  = "200"
            }
          }
        }
        
        ingress_with_cidr_blocks = [
          {
            rule        = "http-80-tcp"
            cidr_blocks = "0.0.0.0/0"
            description = "Enable all access"
          },
          {
            rule        = "https-443-tcp"
            cidr_blocks = "0.0.0.0/0"
            description = "Enable all access"
          }
        ]
        dns_records = {
          "" = {
            zone_name    = "${local.zone_public}"
            private_zone = false
          }
          # To generate a record in the ROOT of the DNS Zone
          # Use as key _null_ 
          # "_null_" = {
          #   zone_name    = local.zone_public
          #   private_zone = false
          # } # This generates for example https://example.com
        }
      }
    }
    alb_defaults = var.alb_defaults
  ```
features:
  - icon: 🛡️
    title: Web Application Firewall
    short_description: Configures WAF rules and automatically attaches WebACL to ALB listeners
    long_description: |
      Perform the creation and configuration of WAF rules (WebAcl) as requested in the configuration, the new WebAcl generated is attached by default to the listeners used by the Amazon ALB service.
    examples:
      - title: Configuration Code
        code: |
          ```hcl
          alb_parameters = {
            "external-00" = {
              ...
              waf_logging_enable    = true
              waf_logging_filter    = {} # Log All events (default only COUNT & BLOCK)
              # waf_logging_retention =  # Default 7 days
              waf_rules = [
                {
                  name     = "AWSManagedRulesCommonRuleSet-rule-1"
                  priority = "10"
          
                  override_action = "none"
          
                  visibility_config = {
                    metric_name = "AWSManagedRulesCommonRuleSet-metric"
                  }
          
                  managed_rule_group_statement = {
                    name        = "AWSManagedRulesCommonRuleSet" //WCU 700
                    vendor_name = "AWS"
                    rule_action_overrides = [
                      {
                        name = "SizeRestrictions_Cookie_HEADER"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "SizeRestrictions_BODY"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "EC2MetaDataSSRF_BODY"
                        action_to_use = { count = {} }
                      },
                      {
                        name = "EC2MetaDataSSRF_COOKIE"
                        action_to_use = { count = {} }
                      },
                      {
